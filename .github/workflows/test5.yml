# https://github.com/docker/build-push-action

name: test5 docker

on:
  workflow_dispatch:
    inputs:
      Function:
        description: "Docker Image Function"
        required: true
        default: action
        type: string
      Namespace:
        type: choice
        description: "Docker Image Namespace"
        options: 
          - mycloudai
          - spritstar
  push:
    branches:
      - main
      - test

env:
  artifact_name: artifact
  artifact_path: manifest
  DOCKER_REGISTRY: "registry.cn-shanghai.aliyuncs.com"
  IMAGE_NAME: "nginx"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate Image TAG
        run: |
          IMAGE_TAG=$( date +"%Y%m%d%H%M%S" )
          FUNCTION=${{ github.event_name == 'workflow_dispatch' && inputs.Function || 'action' }}
          DOCKER_NAMESPACE=${{ github.event_name == 'workflow_dispatch' && inputs.Namespace || 'spritstar' }}
          echo "FULL_IMAGE_TAG=${{ env.DOCKER_REGISTRY }}/${DOCKER_NAMESPACE}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}" >> $GITHUB_ENV
          echo "FUNCTION=${FUNCTION}" >> $GITHUB_ENV
          
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          registry: "${{ env.DOCKER_REGISTRY }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: docker
          build-args: |
            FUNCTION=${{ env.FUNCTION }}
          push: true
          tags: ${{ env.FULL_IMAGE_TAG }}

      - name: update mainfest
        run: |
          sed -i "s|\${IMAGE}|${{ env.FULL_IMAGE_TAG }}|g" manifest/qa.yml
          sed -i "s|\${IMAGE}|${{ env.FULL_IMAGE_TAG }}|g" manifest/prod.yml
          docker images -a
          echo "FULL_IMAGE_TAG: ${{ env.FULL_IMAGE_TAG }}" >> "$GITHUB_STEP_SUMMARY"

      - name: upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.artifact_name}}
          path: ${{ env.artifact_path }}
          include-hidden-files: true
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        include:
          - environment: 'qa'
            deploy_file: 'qa.yml'
          - environment: 'prod'
            deploy_file: 'prod.yml'

    environment: ${{ matrix.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Action
        uses: ./.github/actions/deploy
        with:
          ARTIFACT_NAME: ${{ env.artifact_name}}
          ARTIFACT_PATH: ${{ env.artifact_path }}
          DEPLOY_FILE: ${{ matrix.deploy_file }}
          LLM: ${{ vars.LLM }}
