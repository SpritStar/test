name: test2 variable
on:
  workflow_dispatch:

env:
  version: "1.10"  

jobs:
  stage:
    runs-on: ubuntu-latest
    
    steps:
    - name: Run tests
      run: |
        echo "env"
        echo "${{ env.version }}" > a.txt

        echo "repo vari"
        echo "${{ vars.USERNAME }}" >>a.txt

        echo "repo secret"
        echo "${{ secrets.PASSWORD }}" >>a.txt

        echo "org vari"
        echo "${{ vars.NAME }}" >>a.txt

        echo "org secret"
        echo "${{ secrets.NPMRC }}" >>a.txt

    - name: upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: test-artifact
        path: a.txt
        retention-days: 1
